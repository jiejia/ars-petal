# Pushing a version tag (v1.0.1 or 1.0.1) builds the assets and packages an installable theme ZIP.
# The ZIP is attached to a GitHub release for the tag. The tag must match "Version:" in style.css.
name: Release theme ZIP

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # The assignment on its own line makes a failing bin/package.sh fail the step,
      # which `echo "zip=$(...)"` would hide.
      - name: Package the theme
        id: package
        run: |
          zip="$(bash bin/package.sh "$GITHUB_REF_NAME")"
          test -s "$zip"
          unzip -l "$zip" | tail -1
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      # GitHub always zips an artifact. Uploading the build/ars-petal folder (not the ZIP) makes the
      # download, ars-petal.zip, an installable theme with ars-petal/ at its root, not a ZIP inside a ZIP.
      - name: Keep the theme as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ars-petal
          path: |
            build/
            !build/*.zip
          if-no-files-found: error

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
            # A re-pushed tag turns its release back into an "untagged" draft: attach the tag and publish it again.
            gh release edit "$GITHUB_REF_NAME" --tag "$GITHUB_REF_NAME" --draft=false --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "ARS Petal $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
          url="$(gh release view "$GITHUB_REF_NAME" --json url --jq .url)"
          echo "Theme ZIP $(basename "$ZIP") is attached to $url" >> "$GITHUB_STEP_SUMMARY"
